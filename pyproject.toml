[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultcheck"
version = "0.1.0"
description = "Traceability checker for the aleArrhythmia theory vault and its decision records."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Vanio Antunes" }]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vaultcheck = "tools.vaultcheck.__main__:main"

[tool.setuptools]
packages = ["tools", "tools.vaultcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
